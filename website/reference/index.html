<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%fun.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%fun.png" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="The Fun programming language reference — a statically typed language that transpiles to C."
    />
    <title>Fun Language Reference</title>
    <script>
      // Seed the color theme before first paint to avoid a flash of the wrong
      // theme. Prefer an explicit saved choice, then the OS preference, then
      // fall back to the site's original dark default.
      (function () {
        try {
          var stored = localStorage.getItem("fun-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
