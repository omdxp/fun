on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime_backend: posix
            lane: linux-posix
          - os: macos-latest
            runtime_backend: posix
            lane: macos-posix
          - os: windows-latest
            runtime_backend: windows
            lane: windows-native
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      FUN_RUNTIME_BACKEND: ${{ matrix.runtime_backend }}
      FUN_STDLIB_DIR: ${{ github.workspace }}/stdlib
    steps:
      - uses: actions/checkout@v4
      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Force clang on Linux
        if: matrix.os == 'ubuntu-latest'
        # `setup-fun` sets FUN_CC=gcc on every unix runner. Real GCC is
        # stricter than clang about a declaration's C block scope, and
        # the lazily-triggered prototypes a plain (non-generic)
        # function or method gets still land too narrowly scoped in
        # some cases; clang only warns, GCC hard-errors. Tracked
        # separately; macOS's own `gcc` is Apple's clang under an
        # alias, so it was never actually affected.
        run: echo "FUN_CC=clang" >> "$GITHUB_ENV"
      - name: Build fun and fls
        timeout-minutes: 10
        run: FUN_STDLIB_DIR="$PWD/stdlib" fun build
      - name: Run the test suite on ${{ matrix.lane }}
        timeout-minutes: 20
        run: |
          export FUN_STDLIB_DIR="$PWD/stdlib"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./fun-out/bin/fun.exe test src/tests
          else
            ./fun-out/bin/fun test src/tests
          fi
      - name: Validate examples/
        timeout-minutes: 20
        run: |
          export FUN_STDLIB_DIR="$PWD/stdlib"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            FUN_EXE="$PWD/fun-out/bin/fun.exe" ./scripts/run_examples.sh
          else
            FUN_EXE="$PWD/fun-out/bin/fun" ./scripts/run_examples.sh
          fi
  lint:
    runs-on: ubuntu-latest
    env:
      FUN_STDLIB_DIR: ${{ github.workspace }}/stdlib
    steps:
      - uses: actions/checkout@v4
      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fun
        timeout-minutes: 10
        run: FUN_STDLIB_DIR="$PWD/stdlib" fun build
      - run: FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun -fmt-check-all
