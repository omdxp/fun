on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the -memcheck step (see the build job below) run on demand,
  # from the Actions tab or `gh workflow run`, without adding its own
  # several-minutes-plus cost to every ordinary push/PR.
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime_backend: posix
            lane: linux-posix
          - os: macos-latest
            runtime_backend: posix
            lane: macos-posix
          - os: windows-latest
            runtime_backend: windows
            lane: windows-native
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      FUN_RUNTIME_BACKEND: ${{ matrix.runtime_backend }}
      FUN_STDLIB_DIR: ${{ github.workspace }}/stdlib
    steps:
      - uses: actions/checkout@v7
      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
      # Real toolchain availability for the wasm target (Tier 1 of the
      # WebAssembly initiative, see #184/#185): once `emcc` is on PATH,
      # the wasm tests already in the suite (gated to skip gracefully
      # when it's missing, not fail) start actually exercising the real
      # toolchain here instead of only on whoever happens to have it
      # installed locally. One lane only - the wasm target's own output
      # doesn't depend on the build host's platform, so there's nothing
      # for the other two lanes to verify that this one doesn't already.
      - name: Set up emscripten
        if: matrix.os == 'ubuntu-24.04'
        # Pinned, not "latest": emscripten-core/setup-emsdk@v16 defaults to
        # whatever emsdk version is newest at the time, and that recently
        # started bundling a Node build its own generated code requires
        # (26.x) that this runner's own Node (22.23.3) can't run -
        # confirmed directly as a real CI failure, not just the harmless
        # Node-20-deprecation notice the older action tag printed. 6.0.13
        # is the exact version a real, successful run on this same
        # workflow resolved "latest" to not long ago.
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.13
      - name: Set up MSVC for Windows
        if: matrix.os == 'windows-latest'
        uses: omdxp/msvc-dev-cmd@v1
      - name: Build fun and fls
        timeout-minutes: 10
        run: |
          # 3-stage bootstrap, same reasoning as release.yml: the
          # resolved `fun` on PATH is an already-released version, so
          # a PR that changes compiler behavior the compiler's own
          # source now relies on (a new runtime API, a new format
          # placeholder, etc.) needs its own fresh binary to compile
          # correctly, not just the old bootstrap's. Each stage must
          # be invoked by its own explicit path - `fun build` installs
          # under this checkout's own fun-out/bin/, separate from
          # wherever setup-fun installed bare `fun` on PATH.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # On Windows specifically, from a copy of the previous
            # stage's binary rather than the file in place - Windows
            # won't let a running .exe overwrite its own file (unlike
            # POSIX), so building from a copy elsewhere leaves the
            # in-place path free for the new stage's own output.
            #
            # `editbin /STACK:` patches each stage's own PE header with
            # a larger stack reserve directly, after the fact. This is
            # needed regardless of the `/link /STACK:` flag `fun` itself
            # now passes to cl.exe (src/cli/driver.fn): that flag only
            # takes effect for a binary linked BY a `fun` build that
            # already contains it, but stage1-fun.exe here is linked by
            # whatever `fun` setup-fun just installed (an already-released
            # build predating this fix). Without patching stage1-fun.exe
            # itself, it keeps the old default 1 MB stack and can crash
            # self-compiling for stage 2, regardless of what the *source*
            # being compiled says to do - the fix only "arrives" one
            # bootstrap generation late otherwise.
            FUN_CC=cl FUN_STDLIB_DIR="$PWD/stdlib" fun build
            cp fun-out/bin/fun.exe stage1-fun.exe
            editbin /STACK:134217728 stage1-fun.exe
            FUN_CC=cl FUN_STDLIB_DIR="$PWD/stdlib" ./stage1-fun.exe build
            cp fun-out/bin/fun.exe stage2-fun.exe
            editbin /STACK:134217728 stage2-fun.exe
            FUN_CC=cl FUN_STDLIB_DIR="$PWD/stdlib" ./stage2-fun.exe build
          else
            FUN_STDLIB_DIR="$PWD/stdlib" fun build
            FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun build
            FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun build
          fi
      # An explicit, unconditional check (not gated behind the suite's own
      # skip-when-missing wasm tests) that the toolchain set up above
      # actually works here - if `setup-emsdk` itself ever silently breaks,
      # this fails loudly instead of the suite quietly skipping everything
      # and reporting green with no real wasm coverage at all.
      - name: Smoke-test the wasm target
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 5
        run: |
          export FUN_STDLIB_DIR="$PWD/stdlib"
          cat > /tmp/wasm_ci_smoke.fn << 'FNEOF'
          use std.io;
          fun main() num {
            println_fmt("wasm ci smoke: {num}", 6 * 7);
            ret 0;
          }
          FNEOF
          FUN_CC=emcc ./fun-out/bin/fun -in /tmp/wasm_ci_smoke.fn > /tmp/wasm_ci_smoke.out
          grep -q "wasm ci smoke: 42" /tmp/wasm_ci_smoke.out
      - name: Run the test suite on ${{ matrix.lane }}
        if: matrix.os != 'ubuntu-24.04'
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            FUN_CC=cl FUN_STDLIB_DIR="${{ github.workspace }}/stdlib" ./fun-out/bin/fun.exe test .
          else
            export FUN_STDLIB_DIR="$PWD/stdlib"
            ./fun-out/bin/fun test .
          fi
      # The Linux lane runs the suite once, with coverage: the reports below
      # are produced from that one run, and it fails when total coverage is
      # under 80% (docs/tooling.md, "Code Coverage"). Coverage is measured on
      # one platform on purpose: platform-specific code (the Windows backend,
      # for one) is exercised by its own lane's tests, not counted here.
      #
      # The minimum and the exclusions are flags rather than a `[coverage]`
      # table in fun.toml only because this job bootstraps with an already
      # released `fun`, and a release that predates the table rejects it as an
      # unknown one. Once a release reads `[coverage]`, move them there.
      # Left out: sample programs and scripts that are not the compiler, the two
      # process entry points, the language server's stdin/stdout loop (its
      # analysis is covered), the Windows-only sync backend, and the coverage
      # tests' own sample program.
      - name: Run the test suite on ${{ matrix.lane }} with coverage
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 20
        run: |
          export FUN_STDLIB_DIR="$PWD/stdlib"
          mkdir -p coverage
          ./fun-out/bin/fun test . -cover -cover-min 80 -cover-exclude examples,scripts,editors,src/cli/main.fn,src/fls/main.fn,src/fls/server.fn,src/cli/coverage_samples,stdlib/std/sync_backend_windows.fn -cover-report lcov=coverage/lcov.info,cobertura=coverage/cobertura.xml,json=coverage/coverage.json,html=coverage/index.html,text=coverage/summary.txt | tee coverage/test-output.txt
      # Every allocation across the whole suite redirected through the
      # built-in memory checker (see stdlib/std/memcheck.fn): a
      # double-free, use-after-free, or buffer overflow anywhere in the
      # compiler, stdlib, or their own tests fails this step (leak
      # reporting stays off, see Codegen.memcheck_leaks's own note - a
      # test's own process is short-lived by design, so "still
      # allocated when it exits a moment later anyway" isn't a bug).
      # One platform only, same reasoning as coverage just above: a
      # double-free/UAF/overflow is a real bug regardless of which
      # platform's build happens to hit it, so the other two lanes
      # would only pay the extra time for no extra coverage. Manual-
      # trigger only (`workflow_dispatch`, the GitHub Actions
      # equivalent of GitLab's manual job): the guard-page allocator
      # is markedly slower than a real malloc (every allocation costs
      # a real mmap/mprotect syscall pair), enough that this step alone
      # can run well past 30 minutes under load - too costly to add to
      # every ordinary push/PR, but still there on demand from the
      # Actions tab or `gh workflow run ci-dev.yml`.
      - name: Run the test suite on ${{ matrix.lane }} under -memcheck
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        run: |
          export FUN_STDLIB_DIR="$PWD/stdlib"
          # Runs at -memcheck's own lower default parallelism (see
          # driver.fn/codegen.fn), not this runner's full speed: every
          # guarded allocation costs at least a few whole pages even for
          # a tiny payload, and full parallelism means more of them live
          # at once, not just more time saved - genuinely risks this
          # runner's own memory ceiling, not only wall-clock time.
          ./fun-out/bin/fun test . -memcheck
      - name: Summarize coverage
        if: always() && matrix.os == 'ubuntu-24.04'
        run: |
          if [ -f coverage/test-output.txt ]; then
            {
              echo "## Code coverage"
              echo
              grep '^coverage:' coverage/test-output.txt | tail -1
              echo
              echo "Enforced minimum: \`[coverage] min\` in fun.toml. The lcov, Cobertura, JSON and HTML reports are attached to this run as the \`coverage-report\` artifact."
              echo
              echo "<details><summary>Coverage by file</summary>"
              echo
              echo '```text'
              cat coverage/summary.txt 2>/dev/null || true
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the coverage reports
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      - name: Upload coverage reports to Codecov
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
      # The VS Code extension's Test Explorer and coverage integration: type
      # check, then its unit tests and a smoke test that runs the integration
      # against the `fun` this job just built.
      - name: Set up Node for the VS Code extension
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Test the VS Code extension
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        working-directory: editors/vscode
        run: |
          npm ci
          npm run check-types
          FUN_SMOKE_EXE="${{ github.workspace }}/fun-out/bin/fun" npm test
      - name: Validate examples/
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            FUN_CC=cl FUN_STDLIB_DIR="${{ github.workspace }}/stdlib" FUN_EXE="$PWD/fun-out/bin/fun.exe" ./scripts/run_examples.sh
          else
            export FUN_STDLIB_DIR="$PWD/stdlib"
            FUN_EXE="$PWD/fun-out/bin/fun" ./scripts/run_examples.sh
          fi
  lint:
    runs-on: ubuntu-24.04
    env:
      FUN_STDLIB_DIR: ${{ github.workspace }}/stdlib
    steps:
      - uses: actions/checkout@v7
      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fun
        timeout-minutes: 10
        run: |
          # Same 3-stage bootstrap as the build job; see its comment.
          FUN_STDLIB_DIR="$PWD/stdlib" fun build
          FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun build
          FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun build
      - run: FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun -fmt-check-all
      # The compiler's own source and the stdlib stay warning-clean. Run
      # from the freshly built binary: the `fun` setup-fun installed is a
      # released build that may predate `fun lint`.
      - name: Lint the compiler and stdlib
        run: |
          FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun lint src
          FUN_STDLIB_DIR="$PWD/stdlib" ./fun-out/bin/fun lint stdlib
