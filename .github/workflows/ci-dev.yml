on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  zig_version: 0.14.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - name: Skip LSP (fls) tests in CI
        run: |
          sed -i.bak 's/^\(\s*\)_ = @import("fls_e2e_test.zig");/\1\/\/ _ = @import("fls_e2e_test.zig");/' tests/main_test.zig
      - run: zig build test # usingnamespace is not supported for incremental compilation
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - run: zig build run -- -in examples/test.fn # usingnamespace is not supported for incremental compilation
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - run: zig fmt --check .
