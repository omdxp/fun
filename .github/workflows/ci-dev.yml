on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  zig_version: 0.16.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime_backend: posix
            lane: linux-posix
          - os: macos-latest
            runtime_backend: posix
            lane: macos-posix
          - os: windows-latest
            runtime_backend: windows
            lane: windows-native
    runs-on: ${{ matrix.os }}
    env:
      FUN_RUNTIME_BACKEND: ${{ matrix.runtime_backend }}
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - name: Run all tests (including fls LSP) on ${{ matrix.lane }}
        timeout-minutes: 35
        run: zig build test --summary all
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - run: zig build run -- -in examples/test.fn # usingnamespace is not supported for incremental compilation
  examples:
    runs-on: ubuntu-latest
    env:
      FUN_STDLIB_DIR: ${{ github.workspace }}/stdlib
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - run: zig build
      - run: FUN_STDLIB_DIR="$GITHUB_WORKSPACE/stdlib" ./scripts/run_examples.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.zig_version }}
      - run: zig fmt --check .
