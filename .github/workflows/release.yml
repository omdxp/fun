# =============================================================
# 'fun' Compiler Release Workflow
#
# This workflow builds the 'fun' binary for multiple platforms
# and uploads the resulting artifacts for each release. Every
# target is built natively on a runner of its own architecture
# (no cross-compilation): a previously published `fun` release
# bootstraps the toolchain, which then builds this checkout's
# own compiler and language server via `fun build`.
#
# - Triggers: Manual (workflow_dispatch) or GitHub Release publish
# - Matrix build: Linux, Windows, macOS (x86_64 & aarch64)
# - Artifacts: Built executables for each target
# =============================================================

name: Release

permissions:
  contents: write
  pages: write
  id-token: write

# Workflow triggers:
# - Manually via GitHub UI (workflow_dispatch)
# - Automatically when a new GitHub Release is published
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
  release:
    types: [published]


jobs:
  build-unix-bundles:
    name: Build bundles (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-macos
            os: macos-13
          - target: aarch64-macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check fun.toml's version matches the release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then tag="0.0.0"; fi
          tag="${tag#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' fun.toml)"
          if [ "$manifest_version" != "$tag" ]; then
            echo "fun.toml's version ('$manifest_version') does not match release tag ('$tag')." >&2
            echo "Bump the [package] version in fun.toml to $tag before tagging the release." >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Build fun and fls
        run: |
          set -euo pipefail
          FUN_STDLIB_DIR="$PWD/stdlib" fun build

      - name: Build install bundle for ${{ matrix.target }}
        run: |
          set -euo pipefail
          rm -rf dist artifacts

          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then tag="0.0.0"; fi
          tag="${tag#v}"

          out="dist/fun-${{ matrix.target }}"
          mkdir -p "$out/bin" "$out/share"
          cp fun-out/bin/fun fun-out/bin/fls "$out/bin/"
          chmod 755 "$out/bin/fun" "$out/bin/fls"
          cp -R stdlib "$out/share/fun"
          cp scripts/installer/install.sh "$out/install.sh"
          cp scripts/installer/uninstall.sh "$out/uninstall.sh"
          chmod +x "$out/install.sh" "$out/uninstall.sh"

          # Every target here runs natively, so the built binary can just be
          # asked what version it thinks it is.
          got="$("$out/bin/fun" -version)"
          if [ "$got" != "$tag" ]; then
            echo "Expected version '$tag' but got '$got'" >&2
            exit 1
          fi

          mkdir -p artifacts
          (cd dist && tar -czf ../artifacts/fun-${{ matrix.target }}.tar.gz fun-${{ matrix.target }})
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fun-${{ matrix.target }}
          path: artifacts/fun-${{ matrix.target }}.tar.gz

  build-windows-msi:
    name: Build MSI + portable zip (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows-gnu
            os: windows-latest
          - target: aarch64-windows-gnu
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up fun
        uses: omdxp/setup-fun@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WiX Toolset (v3)
        run: choco install wixtoolset -y

      - name: Make WiX Toolset available on PATH
        # choco updates the machine PATH in the registry, but this job's
        # own process doesn't pick that up mid-run - reliable on the x64
        # runner, not on windows-11-arm, where heat/candle/light are
        # otherwise not found later in this same job. Resolving the
        # install location directly and appending it via GITHUB_PATH
        # works on both regardless of why the implicit refresh differs.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $heat = Get-ChildItem -Path 'C:\Program Files*\WiX Toolset*', 'C:\ProgramData\chocolatey\lib\wixtoolset*' -Recurse -Filter heat.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $heat) {
            throw "heat.exe not found after installing WiX Toolset"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $heat.DirectoryName

      - name: Check fun.toml's version matches the release tag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          if ($tag -and $tag.StartsWith('v')) { $tag = $tag.Substring(1) }
          if (-not $tag) { $tag = '0.0.0' }
          $manifestVersion = (Select-String -Path fun.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($manifestVersion -ne $tag) {
            throw "fun.toml's version ('$manifestVersion') does not match release tag ('$tag'). Bump the [package] version in fun.toml to $tag before tagging the release."
          }

      - name: Build fun and fls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FUN_STDLIB_DIR = "$PWD\stdlib"
          fun build

      - name: Build MSI + portable zip for ${{ matrix.target }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force dist, artifacts -ErrorAction SilentlyContinue

          $tag = "${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          if ($tag -and $tag.StartsWith('v')) { $tag = $tag.Substring(1) }
          if (-not $tag) { $tag = '0.0.0' }

          $out = "dist\fun-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$out\bin" | Out-Null
          Copy-Item "fun-out\bin\fun.exe" "$out\bin\fun.exe"
          Copy-Item "fun-out\bin\fls.exe" "$out\bin\fls.exe"
          Copy-Item -Recurse "stdlib" "$out\share\fun"

          # Every target here runs natively, so the built binary can just be
          # asked what version it thinks it is.
          $exePath = "$out\bin\fun.exe"
          $got = & $exePath -version
          if ($LASTEXITCODE -ne 0) { throw "Version check failed running $exePath" }
          $got = ($got | Out-String).Trim()
          if ($got -ne $tag) {
            throw "Expected version '$tag' but got '$got'"
          }

          Copy-Item "installer\windows\PORTABLE-README.txt" "$out\README-portable.txt"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          # Build portable zip that can be unzipped and run without installing.
          $portableZip = "artifacts\fun-${{ matrix.target }}-$tag.zip"
          Compress-Archive -Path $out -DestinationPath $portableZip -Force

          # WiX Product/@Version requires x.x.x.x with each x in [0, 65534].
          # Accept tags like 1.2.3 or 1.2.3-beta and normalize.
          $m = [regex]::Match($tag, '^(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:\.(\d+))?')
          if (-not $m.Success) {
            $p = @(0,0,0,0)
          } else {
            $g2 = $m.Groups[2].Value
            $g3 = $m.Groups[3].Value
            $g4 = $m.Groups[4].Value
            $n2 = 0; if ($g2) { $n2 = [int]$g2 }
            $n3 = 0; if ($g3) { $n3 = [int]$g3 }
            $n4 = 0; if ($g4) { $n4 = [int]$g4 }
            $p = @(
              [int]$m.Groups[1].Value,
              $n2,
              $n3,
              $n4
            )
          }
          for ($i = 0; $i -lt 4; $i++) {
            if ($p[$i] -lt 0) { $p[$i] = 0 }
            if ($p[$i] -gt 65534) { $p[$i] = 65534 }
          }
          $wixVersion = "$($p[0]).$($p[1]).$($p[2]).$($p[3])"
          Write-Host "Tag: $tag"
          Write-Host "WiX Version: $wixVersion"

          $src = $out
          $harvest = "dist\Harvest.wxs"
          # -ag makes heat emit Component Guid="*" (stable, deterministic GUIDs based on keypath)
          heat dir $src -cg FunFiles -dr INSTALLFOLDER -ag -srd -sreg -sfrag -var var.SourceDir -out $harvest

          $product = "installer\windows\Product.wxs"
          $objDir = "dist\wixobj"
          New-Item -ItemType Directory -Force $objDir | Out-Null

          $candleArgs = @(
            '-nologo',
            '-ext', 'WixUtilExtension',
            '-ext', 'WixUIExtension',
            ("-dSourceDir=$src"),
            ("-dProductVersion=$wixVersion"),
            '-out', ("$objDir\\"),
            $product,
            $harvest
          )
          & candle @candleArgs

          $msi = "artifacts\fun-${{ matrix.target }}-$tag.msi"
          $lightArgs = @(
            '-nologo',
            '-ext', 'WixUtilExtension',
            '-ext', 'WixUIExtension',
            '-out', $msi,
            ("$objDir\\Product.wixobj"),
            ("$objDir\\Harvest.wixobj")
          )
          & light @lightArgs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fun-${{ matrix.target }}
          path: |
            artifacts/*.msi
            artifacts/*.zip


# =============================================================
# Release Asset Upload Job
# This job runs only on GitHub Release events and uploads all
# built artifacts as assets to the published release.
# =============================================================

  upload-release-assets:
    name: Upload release assets
    needs: [build-unix-bundles, build-windows-msi]
    runs-on: ubuntu-latest
    # Keep this release-only: workflow_dispatch may not have a published Release to attach assets to.
    if: github.event_name == 'release'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: resolve_tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            echo "No release tag available" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: |
            artifacts/**/fun-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-reference-site:
    name: Build reference website
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/reference/package-lock.json

      - name: Install web dependencies
        run: npm --prefix website/reference ci

      - name: Generate historical docs snapshots from tags
        shell: bash
        run: |
          set -euo pipefail

          rm -rf website/reference/public/versions
          mkdir -p website/reference/public/versions

          mapfile -t tags < <(git tag --list 'v*' --sort=version:refname)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No matching tags found (pattern v*); skipping historical snapshots."
            exit 0
          fi

          tmp_root=".tmp-reference-worktrees"
          mkdir -p "$tmp_root"

          generated_count=0
          failed_tags=()

          cleanup() {
            if [ -d "$tmp_root" ]; then
              find "$tmp_root" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' d; do
                git worktree remove --force "$d" || true
              done
            fi
          }
          trap cleanup EXIT

          for tag in "${tags[@]}"; do
            safe_tag="${tag//[^A-Za-z0-9_.-]/_}"
            wt="$tmp_root/$safe_tag"
            echo "Generating docs snapshot for $tag"

            if ! git worktree add --detach "$wt" "$tag"; then
              echo "Failed to create worktree for $tag; skipping"
              failed_tags+=("$tag")
              continue
            fi

            if [ ! -d "$wt/website/reference" ]; then
              echo "Tag $tag does not include website/reference; skipping"
              git worktree remove --force "$wt"
              continue
            fi

            if ! npm --prefix "$wt/website/reference" ci; then
              echo "npm ci failed for $tag; skipping"
              failed_tags+=("$tag")
              git worktree remove --force "$wt"
              continue
            fi

            if ! FUN_VERSION="$tag" npm --prefix "$wt/website/reference" run generate:content; then
              echo "content generation failed for $tag; skipping"
              failed_tags+=("$tag")
              git worktree remove --force "$wt"
              continue
            fi

            version="${tag#v}"
            src="$wt/website/reference/public/versions/$version/content.json"
            if [ -f "$src" ]; then
              mkdir -p "website/reference/public/versions/$version"
              cp "$src" "website/reference/public/versions/$version/content.json"
              generated_count=$((generated_count + 1))
            else
              echo "No content generated for $tag at expected path: $src"
              failed_tags+=("$tag")
            fi

            git worktree remove --force "$wt"
          done

          echo "Historical snapshots generated: $generated_count"
          if [ "${#failed_tags[@]}" -gt 0 ]; then
            echo "Tags skipped due to errors (${#failed_tags[@]}): ${failed_tags[*]}"
          fi

      - name: Build reference site for GitHub Pages
        run: |
          npm --prefix website/reference run sync:version
          npm --prefix website/reference run generate:content
          npm --prefix website/reference run build:web
        env:
          VITE_BASE_PATH: /fun/
          FUN_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/reference/dist

  deploy-reference-site:
    name: Deploy reference website
    runs-on: ubuntu-latest
    needs: [build-reference-site]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
