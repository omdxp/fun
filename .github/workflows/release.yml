# =============================================================
# Zig 'fun' Compiler Release Workflow
#
# This workflow builds the 'fun' binary for multiple platforms
# and uploads the resulting artifacts for each release.
#
# - Triggers: Manual (workflow_dispatch) or GitHub Release publish
# - Matrix build: Linux, Windows, macOS (x86_64 & aarch64)
# - Artifacts: Built executables for each target
# =============================================================

name: Release

# Workflow triggers:
# - Manually via GitHub UI (workflow_dispatch)
# - Automatically when a new GitHub Release is published
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
  release:
    types: [published]


jobs:
  build-unix-bundles:
    name: Build bundles (Linux/macOS)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      matrix:
        zig_version: [0.14.0]
        target:
          - x86_64-linux-gnu
          - x86_64-macos
          - aarch64-linux-gnu
          - aarch64-macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig ${{ matrix.zig_version }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Build install bundle for ${{ matrix.target }}
        run: |
          set -euo pipefail
          rm -rf dist artifacts
          zig build install -Dtarget=${{ matrix.target }} --prefix dist/fun-${{ matrix.target }}
          cp scripts/installer/install.sh dist/fun-${{ matrix.target }}/install.sh
          cp scripts/installer/uninstall.sh dist/fun-${{ matrix.target }}/uninstall.sh
          chmod +x dist/fun-${{ matrix.target }}/install.sh dist/fun-${{ matrix.target }}/uninstall.sh || true
          mkdir -p artifacts
          (cd dist && tar -czf ../artifacts/fun-${{ matrix.target }}.tar.gz fun-${{ matrix.target }})

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fun-${{ matrix.target }}
          path: artifacts/fun-${{ matrix.target }}.tar.gz

  build-windows-msi:
    name: Build MSI (Windows)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      matrix:
        zig_version: [0.14.0]
        target:
          - x86_64-windows-gnu
          - aarch64-windows-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig ${{ matrix.zig_version }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Install WiX Toolset (v3)
        run: choco install wixtoolset -y

      - name: Build MSI for ${{ matrix.target }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force dist, artifacts -ErrorAction SilentlyContinue
          zig build install -Dtarget=${{ matrix.target }} --prefix dist\fun-${{ matrix.target }}

          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if ($tag -and $tag.StartsWith('v')) { $tag = $tag.Substring(1) }
          if (-not $tag) { $tag = '0.0.0' }

          # WiX Product/@Version requires x.x.x.x with each x in [0, 65534].
          # Accept tags like 1.2.3 or 1.2.3-beta and normalize.
          $m = [regex]::Match($tag, '^(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:\.(\d+))?')
          if (-not $m.Success) {
            $p = @(0,0,0,0)
          } else {
            $g2 = $m.Groups[2].Value
            $g3 = $m.Groups[3].Value
            $g4 = $m.Groups[4].Value
            $n2 = 0; if ($g2) { $n2 = [int]$g2 }
            $n3 = 0; if ($g3) { $n3 = [int]$g3 }
            $n4 = 0; if ($g4) { $n4 = [int]$g4 }
            $p = @(
              [int]$m.Groups[1].Value,
              $n2,
              $n3,
              $n4
            )
          }
          for ($i = 0; $i -lt 4; $i++) {
            if ($p[$i] -lt 0) { $p[$i] = 0 }
            if ($p[$i] -gt 65534) { $p[$i] = 65534 }
          }
          $wixVersion = "$($p[0]).$($p[1]).$($p[2]).$($p[3])"

          New-Item -ItemType Directory -Force artifacts | Out-Null

          $src = "dist\fun-${{ matrix.target }}"
          $harvest = "dist\Harvest.wxs"
          # -ag makes heat emit Component Guid="*" (stable, deterministic GUIDs based on keypath)
          heat dir $src -cg FunFiles -dr INSTALLFOLDER -ag -srd -sreg -sfrag -var var.SourceDir -out $harvest

          $product = "installer\windows\Product.wxs"
          $objDir = "dist\wixobj"
          New-Item -ItemType Directory -Force $objDir | Out-Null

          candle -nologo -ext WixUtilExtension -ext WixUIExtension `
            -dSourceDir=$src `
            -dProductVersion=$wixVersion `
            -out "$objDir\\" $product $harvest

          $msi = "artifacts\fun-${{ matrix.target }}-$tag.msi"
          light -nologo -ext WixUtilExtension -ext WixUIExtension -out $msi `
            "$objDir\\Product.wixobj" "$objDir\\Harvest.wixobj"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fun-${{ matrix.target }}
          path: artifacts/*.msi


# =============================================================
# Release Asset Upload Job
# This job runs only on GitHub Release events and uploads all
# built artifacts as assets to the published release.
# =============================================================

  upload-release-assets:
    name: Upload release assets
    needs: [build-unix-bundles, build-windows-msi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/fun-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
