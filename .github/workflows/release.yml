# =============================================================
# Zig 'fun' Compiler Release Workflow
#
# This workflow builds the 'fun' binary for multiple platforms
# and uploads the resulting artifacts for each release.
#
# - Triggers: Manual (workflow_dispatch) or GitHub Release publish
# - Matrix build: Linux, Windows, macOS (x86_64 & aarch64)
# - Artifacts: Built executables for each target
# =============================================================

name: Release

# Workflow triggers:
# - Manually via GitHub UI (workflow_dispatch)
# - Automatically when a new GitHub Release is published
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
  release:
    types: [published]


jobs:
  update-changelog:
    name: Update and commit CHANGELOG.md
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-cliff
        run: |
          version="2.11.0"
          wget "https://github.com/orhun/git-cliff/releases/download/v${version}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz
          sudo mv git-cliff-${version}-x86_64-unknown-linux-gnu/git-cliff /usr/local/bin/git-cliff

      - name: Generate and commit CHANGELOG.md
        run: |
          git-cliff -o CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for release" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-matrix:
    name: Build fun for all targets
    runs-on: ubuntu-latest
    # Only run this job for manual or release events
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    strategy:
      matrix:
        zig_version: [0.14.0]
        target:
          # Supported build targets (add/remove as needed)
          - x86_64-linux-gnu
          - x86_64-windows-gnu
          - x86_64-macos
          - aarch64-linux-gnu
          - aarch64-macos
          - aarch64-windows-gnu
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install the required Zig toolchain
      - name: Set up Zig ${{ matrix.zig_version }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      # Step 3: Build the 'fun' binary for the current matrix target
      - name: Build fun for ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Drelease=true

      # Step 4: Upload the built binary as a workflow artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fun-${{ matrix.target }}
          path: zig-out/bin/fun*


# =============================================================
# Release Asset Upload Job
# This job runs only on GitHub Release events and uploads all
# built artifacts as assets to the published release.
# =============================================================

  upload-release-assets:
    name: Upload release assets
    needs: [build-matrix, update-changelog]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
